name: Folio PDF unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [folio-pdf-build]
permissions:
  contents: read
concurrency:
  group: folio-pdf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: FolioPDF
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show selected Xcode
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project FolioPDF.xcodeproj -scheme FolioPDF -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Test on iPhone Simulator
        timeout-minutes: 12
        env:
          FOLIO_TEST_ACTION: test-without-building
        run: bash scripts/test_ios.sh
      - name: Export UI test screenshots
        if: always()
        continue-on-error: true
        run: |
          for result in build/*.xcresult; do
            xcrun xcresulttool export attachments --path "$result" --output-path build/screenshots
          done
      - name: Build unsigned device archive
        run: |
          xcodebuild -project FolioPDF.xcodeproj -scheme FolioPDF -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/FolioPDF.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive
      - name: Package unsigned IPA for later signing
        run: |
          mkdir -p build/package/Payload
          cp -R build/FolioPDF.xcarchive/Products/Applications/FolioPDF.app build/package/Payload/
          cd build/package
          /usr/bin/zip -qry ../FolioPDF-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: FolioPDF-unsigned-needs-signing
          path: FolioPDF/build/FolioPDF-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iOS-test-results
          path: |
            FolioPDF/build/*.xcresult
            FolioPDF/build/screenshots
          if-no-files-found: ignore
